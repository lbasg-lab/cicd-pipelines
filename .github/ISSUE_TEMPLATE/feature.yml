name: 🚀 Feature
description: Propose a new feature or capability.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be implemented?
      placeholder: Describe the objective of this feature.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why is this feature needed?
      placeholder: Provide context or motivation.

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed implementation.
      placeholder: Explain your proposed solution.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List the conditions that must be met.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      placeholder: Links, references or additional information.