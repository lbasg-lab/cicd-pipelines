name: 🐛 Bug
description: Report an unexpected behavior or defect.
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 / Ubuntu 24.04 / Docker 28...

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes