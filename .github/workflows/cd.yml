name: Reusable CD

on:
  workflow_call:
    inputs:
      config:
        description: Path to the CI/CD configuration file
        required: false
        type: string
        default: .cicd-config.yml

      apply:
        description: Whether the deployment should be applied
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest

    outputs:
      runtime_stack: ${{ steps.validate.outputs.runtime_stack }}
      runtime_version: ${{ steps.validate.outputs.runtime_version }}
      working_directory: ${{ steps.validate.outputs.working_directory }}

    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          path: consumer

      - name: Checkout CI/CD framework
        uses: actions/checkout@v4
        with:
          repository: lbasg-lab/cicd-pipelines
          ref: ${{ github.workflow_sha }}
          path: cicd-pipelines

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install framework dependencies
        run: pip install -r cicd-pipelines/requirements.txt

      - name: Validate configuration
        id: validate
        run: |
          python cicd-pipelines/scripts/validate_config.py \
            "consumer/${{ inputs.config }}" \
            --github-output "$GITHUB_OUTPUT"

  terraform:
    needs: validate
    if: needs.validate.outputs.runtime_stack == 'terraform'
    uses: ./.github/workflows/terraform-cd.yml
    with:
      terraform-version: ${{ needs.validate.outputs.runtime_version }}
      working-directory: ${{ needs.validate.outputs.working_directory }}
      apply: ${{ inputs.apply }}
